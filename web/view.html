<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Bağlanıyor… · RemoteDesk</title>
  <link rel="stylesheet" href="style.css">
  <script src="titlebar.js"></script>
</head>
<body class="viewer">
  <div id="bar" class="vbar" data-titlebar>
    <div class="vinfo">
      <span id="vTitle" class="title mono"></span>
      <span id="busy" class="badge hidden"></span>
      <span id="permBadge" class="badge hidden">Yalnızca izleme</span>
      <span id="people" class="badge people hidden"></span>
      <span id="vStat" class="stat mono"></span>
    </div>
    <button id="menuBtn" class="small menu-btn" type="button" aria-label="Menü">Menü</button>
    <div class="vctl" id="vctl">
      <select id="display" class="vdisp hidden" title="Görüntülenen monitör"></select>
      <details id="vset" class="vset">
        <summary>Ayarlar</summary>
        <div class="vset-pop">
          <label class="vrow" title="H.264 akıcıdır ve az bant genişliği kullanır, JPEG her yerde çalışır"><span>Sıkıştırma</span>
            <select id="codec">
              <option value="h264">H.264</option>
              <option value="jpeg">JPEG</option>
            </select>
          </label>
          <label class="vrow"><span>Kalite</span>
            <select id="quality">
              <option value="40">Hızlı</option>
              <option value="65" selected>Dengeli</option>
              <option value="85">Kaliteli</option>
            </select>
          </label>
          <label class="vrow" title="Panoyu (kopyala/yapıştır) iki yönlü senkronize et"><span>Pano paylaşımı</span><input type="checkbox" class="switch" id="clipSync" checked></label>
          <label class="vrow"><span>Gerçek boyut</span><input type="checkbox" class="switch" id="scale"></label>
        </div>
      </details>
      <button id="drawBtn" class="small" title="Ekrana çiz: bağlı herkes ve karşı taraf görür">Çiz</button>
      <button id="callBtn" class="small" title="Karşı tarafla sesli konuş">Sesli görüşme</button>
      <button id="muteBtn" class="small hidden">Sessize al</button>
      <button id="fs" class="small">Tam ekran</button>
      <button id="disc" class="danger small">Bağlantıyı kes</button>
    </div>
  </div>
  <div id="callBar" class="callbar hidden">
    <span id="callText"></span>
    <span class="spacer"></span>
    <span class="call-btns"><button id="callAccept" class="primary small">Kabul et</button>
    <button id="callReject" class="small">Reddet</button></span>
  </div>
  <div id="vwarn" class="vwarn hidden"></div>
  <div id="stage" class="stage">
    <canvas id="screen" class="fit" tabindex="0"></canvas>
    <div id="overlay" class="overlay">Bağlanıyor…</div>
    <!-- Ekrana çizim: görüntünün tam üstünde saydam katman ve araç çubuğu -->
    <canvas id="ink" class="ink"></canvas>
    <div id="inkBar" class="inkbar hidden" role="toolbar" aria-label="Çizim">
      <button type="button" class="itool on" data-tool="pen" title="Kalem (kalıcı)" aria-label="Kalem">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
      </button>
      <button type="button" class="itool" data-tool="laser" title="Lazer işaretçi (kısa süre sonra kaybolur)" aria-label="Lazer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
      <span class="isep"></span>
      <button type="button" class="iswatch on" data-col="#ff453a" style="--c:#ff453a" aria-label="Kırmızı"></button>
      <button type="button" class="iswatch" data-col="#ffd60a" style="--c:#ffd60a" aria-label="Sarı"></button>
      <button type="button" class="iswatch" data-col="#32d74b" style="--c:#32d74b" aria-label="Yeşil"></button>
      <button type="button" class="iswatch" data-col="#0a84ff" style="--c:#0a84ff" aria-label="Mavi"></button>
      <button type="button" class="iswatch" data-col="#ffffff" style="--c:#ffffff" aria-label="Beyaz"></button>
      <span class="isep"></span>
      <button type="button" id="inkUndo" class="itool" title="Son çizgimi geri al (Ctrl+Z)" aria-label="Geri al">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
      </button>
      <button type="button" id="inkWipe" class="itool" title="Herkesin çizimini sil" aria-label="Hepsini sil">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </button>
      <button type="button" id="inkDone" class="itool done" title="Çizimi bitir (Esc)">Bitti</button>
    </div>
    <!-- Tarayıcıdan erişim: tünel adresi doğrudan açıldığında şifre sorulur. -->
    <form id="webLogin" class="weblogin hidden" autocomplete="off">
      <div class="wl-card">
        <div class="brand"><span class="logo"></span>RemoteDesk</div>
        <p class="wl-lead">Şifreyi biliyorsan gir; boş bırakırsan karşı taraf bağlantı isteğini onaylar.</p>
        <div class="field">
          <label for="wlName">Adın</label>
          <input id="wlName" type="text" maxlength="32" placeholder="Karşı tarafta görünür" spellcheck="false">
        </div>
        <div class="field">
          <label for="wlPw">Şifre <span class="opt">isteğe bağlı</span></label>
          <input id="wlPw" type="password" autocomplete="current-password">
        </div>
        <button class="primary block" type="submit">Bağlan</button>
        <div id="wlErr" class="error-text"></div>
        <p class="hint">Bağlantı şifreli; şifre bu sayfadan yalnızca karşı bilgisayara gider.</p>
      </div>
    </form>
  </div>
  <!-- Dokunmatik ekran: sağ altta yüzen düğmeler ve telefon klavyesi için gizli giriş kutusu -->
  <div id="mbar" class="fabs">
    <button id="zoomReset" type="button" class="fab sm hidden" aria-label="Sığdır" title="Sığdır">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg>
    </button>
    <button id="menuBtn2" type="button" class="fab sm" aria-label="Menü" title="Menü">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
    </button>
    <button id="kbBtn" type="button" class="fab" aria-label="Klavye" title="Klavye">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6.5 14h11"/></svg>
    </button>
  </div>
  <textarea id="kb" class="kbin" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>
  <div id="sheetBg" class="sheet-bg"></div>
  <div id="toast" class="toast"></div>
  <script src="rtc.js"></script>
  <script src="view.js"></script>
</body>
</html>
