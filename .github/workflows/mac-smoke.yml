name: mac-smoke

# İmzalı + noter onaylı paketi gerçek bir Mac'te, kullanıcının yaptığı gibi açar:
# indir → karantina işareti → Uygulamalar'a çıkar → `open` (Finder çift tıkla aynı yol).
# Ekrana çıkan pencereler ekran görüntüsü olarak artifact'e konur.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Test edilecek release etiketi
        required: true

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sistem
        run: sw_vers; uname -m

      - name: Paketi indir ve kullanıcı gibi kur
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*-macos.zip' -D dl
          ZIP="$(ls dl/*-macos.zip)"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$ZIP"
          ditto -x -k "$ZIP" /Applications
          xattr -l /Applications/RemoteDesk.app | head -5
          ls -la /Applications/RemoteDesk.app/Contents/MacOS

      - name: İmza ve Gatekeeper
        run: |
          codesign -dv --verbose=4 /Applications/RemoteDesk.app 2>&1 | head -20 || true
          codesign --verify --deep --strict --verbose=2 /Applications/RemoteDesk.app 2>&1 || true
          spctl -a -vv -t exec /Applications/RemoteDesk.app 2>&1 || true
          xcrun stapler validate /Applications/RemoteDesk.app 2>&1 || true

      - name: Açma denemesi 1 (karantinalı, open)
        timeout-minutes: 3
        run: |
          mkdir -p shots
          date '+%Y-%m-%d %H:%M:%S' > start.txt
          ( open /Applications/RemoteDesk.app; echo "open çıkış kodu: $?" > open1.txt ) &
          sleep 20
          screencapture -x shots/1-karantinali.png || true
          cat open1.txt 2>/dev/null || echo "open hâlâ bekliyor (ekranda bir pencere olabilir)"
          pgrep -fl RemoteDesk || echo "RemoteDesk süreci YOK"
          echo "--- uygulama log'u"
          cat ~/Library/Application\ Support/RemoteDesk/remotedesk.log 2>&1 | head -60
          echo "--- çökme raporları"
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i remotedesk || echo "çökme raporu yok"
          for f in ~/Library/Logs/DiagnosticReports/RemoteDesk*; do [ -f "$f" ] && head -100 "$f"; done
          pkill -f RemoteDesk || true; pkill -x open || true
          osascript -e 'tell application "System Events" to keystroke return' 2>/dev/null || true

      - name: Açma denemesi 2 (karantinasız, open)
        timeout-minutes: 3
        run: |
          xattr -dr com.apple.quarantine /Applications/RemoteDesk.app
          rm -f ~/Library/Application\ Support/RemoteDesk/remotedesk.log
          ( open /Applications/RemoteDesk.app; echo "open çıkış kodu: $?" > open2.txt ) &
          sleep 20
          screencapture -x shots/2-karantinasiz.png || true
          cat open2.txt 2>/dev/null || echo "open hâlâ bekliyor (ekranda bir pencere olabilir)"
          pgrep -fl RemoteDesk || echo "RemoteDesk süreci YOK"
          cat ~/Library/Application\ Support/RemoteDesk/remotedesk.log 2>&1 | head -60
          pkill -f RemoteDesk || true; pkill -x open || true

      - uses: actions/checkout@v4
        if: always()
        with:
          clean: false # önceki adımların ekran görüntüleri silinmesin

      - uses: actions/setup-go@v5
        if: always()
        with:
          go-version-file: go.mod

      - name: Ad etiketi (probe ile bağlan, fareyi gezdir)
        if: always()
        timeout-minutes: 4
        run: |
          pkill -f RemoteDesk || true
          go build -o probe ./cmd/probe
          /Applications/RemoteDesk.app/Contents/MacOS/RemoteDesk -headless -notunnel -autoaccept -concurrent -password testsifre > label-host.txt 2>&1 &
          HOST=$!
          for i in $(seq 1 30); do grep -q "ID *:" label-host.txt && break; sleep 1; done
          ADDR="$(sed -n 's/.*ID *: *//p' label-host.txt | head -1)"
          echo "host: $ADDR"
          ./probe -url "ws://$ADDR/ws" -pw testsifre -name "CI Test Kullanıcı" -move -dur 6s > label-probe.txt 2>&1 &
          sleep 3
          screencapture -x shots/4-etiket.png || true
          sleep 4
          kill $HOST 2>/dev/null; wait $HOST 2>/dev/null
          echo "--- host"; head -40 label-host.txt
          echo "--- probe"; grep -E "kontrol: \{\"(t|enc)\":\"(mode|busy|warn)|ilk kare" label-probe.txt | head -10

      - name: Doğrudan çalıştırma (stderr)
        if: always()
        timeout-minutes: 2
        run: |
          /Applications/RemoteDesk.app/Contents/MacOS/RemoteDesk -headless -notunnel -autoaccept > direct.txt 2>&1 &
          PID=$!
          sleep 10
          kill $PID 2>/dev/null; wait $PID 2>/dev/null
          echo "çıkış: $?"
          head -60 direct.txt

      - name: Sistem log'u
        if: always()
        timeout-minutes: 3
        run: |
          log show --start "$(cat start.txt)" --style compact \
            --predicate 'process == "RemoteDesk" OR eventMessage CONTAINS[c] "RemoteDesk"' \
            2>/dev/null | grep -viE "mdworker|Spotlight|mds" | tail -120 || true

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
